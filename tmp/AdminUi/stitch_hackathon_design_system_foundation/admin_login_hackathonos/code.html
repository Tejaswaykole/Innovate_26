<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>HackSprint Pro - Admin Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary-container": "#57657a",
                        "on-secondary-fixed": "#0d1c2e",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-primary-container": "#eeefff",
                        "tertiary": "#973400",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#0053db",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "secondary": "#515f74",
                        "on-background": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "on-surface-variant": "#434655",
                        "surface-bright": "#f7f9fb",
                        "tertiary-container": "#bf4500",
                        "outline": "#737686",
                        "on-primary-fixed": "#00174b",
                        "surface-variant": "#e0e3e5",
                        "secondary-fixed": "#d5e3fc",
                        "on-surface": "#191c1e",
                        "on-tertiary-container": "#ffede7",
                        "on-secondary-fixed-variant": "#3a485b",
                        "surface": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#7f2b00",
                        "tertiary-fixed": "#ffdbce",
                        "outline-variant": "#c3c6d7",
                        "surface-container-highest": "#e0e3e5",
                        "surface-container-high": "#e6e8ea",
                        "surface-container-low": "#f2f4f6",
                        "surface-container": "#eceef0",
                        "surface-dim": "#d8dadc",
                        "on-primary-fixed-variant": "#003ea8",
                        "background": "#f7f9fb",
                        "primary-container": "#2563eb",
                        "on-tertiary-fixed": "#370e00",
                        "on-error": "#ffffff",
                        "secondary-container": "#d5e3fc",
                        "tertiary-fixed-dim": "#ffb599",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "error-container": "#ffdad6",
                        "primary": "#004ac6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "base": "8px",
                        "lg": "24px",
                        "xxl": "64px",
                        "xs": "4px",
                        "container-max": "1280px",
                        "md": "16px",
                        "sm": "8px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "caption": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col justify-center items-center p-md sm:p-lg antialiased text-on-surface">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_0_rgba(0,0,0,0.1),0_1px_2px_-1px_rgba(0,0,0,0.1)] border border-outline-variant/30 overflow-hidden relative z-10">
<!-- Header Section -->
<header class="pt-xl px-lg pb-md text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-lg bg-surface-container-low mb-lg">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">HackSprint Pro</h1>
<h2 class="font-label-md text-label-md text-primary tracking-widest uppercase">Admin Portal</h2>
</header>
<!-- Form Section -->
<section class="px-lg pb-xl">
<form action="#" class="space-y-lg" method="POST">
<!-- Email Input -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-[44px] pr-md py-3 font-body-md text-body-md bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-on-surface placeholder-outline-variant focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 outline-none" id="email" name="email" placeholder="admin@hacksprint.io" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-caption text-caption text-primary hover:text-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-[44px] pr-[44px] py-3 font-body-md text-body-md bg-surface-container-lowest border border-outline-variant/50 rounded-lg text-on-surface placeholder-outline-variant focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all duration-200 outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface-variant transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Security Note -->
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant/50 rounded focus:ring-primary/20 focus:ring-2 transition-all" id="remember" name="remember" type="checkbox"/>
</div>
<div class="ml-sm">
<label class="font-caption text-caption text-on-surface-variant" for="remember">Remember me on this device</label>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex justify-center items-center py-3 px-md border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-200 active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined mr-sm text-[20px]" data-icon="login">login</span>
                        Secure Login
                    </button>
</div>
</form>
</section>
<!-- Footer / Warning -->
<footer class="bg-surface-container-low py-md px-lg border-t border-outline-variant/30 text-center">
<p class="font-caption text-caption text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-error" data-icon="gpp_bad">gpp_bad</span>
                Unauthorized access is strictly prohibited.
            </p>
</footer>
</main>
<!-- Subtle Background Elements for depth (SaaS feel) -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden flex justify-center items-center">
<div class="w-[800px] h-[800px] rounded-full bg-primary/5 blur-[120px] absolute -top-[400px] -right-[200px]"></div>
<div class="w-[600px] h-[600px] rounded-full bg-secondary/5 blur-[100px] absolute -bottom-[300px] -left-[100px]"></div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
