<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DevSprint Auth - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed-variant": "#3a485b",
                        "secondary-fixed": "#d5e3fc",
                        "on-tertiary-container": "#ffede7",
                        "inverse-surface": "#2d3133",
                        "on-secondary-container": "#57657a",
                        "surface": "#f7f9fb",
                        "tertiary-fixed-dim": "#ffb599",
                        "surface-container-low": "#f2f4f6",
                        "on-secondary-fixed": "#0d1c2e",
                        "on-error-container": "#93000a",
                        "primary": "#004ac6",
                        "tertiary": "#973400",
                        "outline-variant": "#c3c6d7",
                        "surface-container-high": "#e6e8ea",
                        "on-background": "#191c1e",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-container": "#eeefff",
                        "inverse-primary": "#b4c5ff",
                        "outline": "#737686",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-tertiary-fixed": "#370e00",
                        "surface-bright": "#f7f9fb",
                        "tertiary-fixed": "#ffdbce",
                        "secondary": "#515f74",
                        "on-tertiary-fixed-variant": "#7f2b00",
                        "tertiary-container": "#bf4500",
                        "on-error": "#ffffff",
                        "background": "#f7f9fb",
                        "on-surface-variant": "#434655",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-primary-fixed": "#00174b",
                        "primary-container": "#2563eb",
                        "secondary-container": "#d5e3fc",
                        "on-surface": "#191c1e",
                        "surface-dim": "#d8dadc",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-on-surface": "#eff1f3",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-tint": "#0053db",
                        "surface-container": "#eceef0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xxl": "64px",
                        "sm": "8px",
                        "base": "8px",
                        "xs": "4px",
                        "container-max": "1280px",
                        "lg": "24px",
                        "md": "16px",
                        "gutter": "24px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "caption": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "caption": ["12px", { "lineHeight": "1.4", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Shared Level 1 shadow */
        .elevation-1 {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }
        /* Level 2 shadow for hover/active */
        .elevation-2:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            transform: translateY(-1px);
        }
        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }
        
        /* Input focus rings */
        .input-focus-ring:focus-within {
            border-color: #2563EB;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md antialiased">
<!-- NO SHELL NAVIGATION: The user is in a transactional/login state. Nav is suppressed. -->
<main class="flex-grow flex items-center justify-center p-md md:p-gutter">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-surface-variant elevation-1 p-xl">
<!-- Branding -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-sm">DevSprint Auth</h1>
<p class="font-body-md text-body-md text-secondary">Sign in to access your hackathon dashboard.</p>
</div>
<!-- Login Form -->
<form class="space-y-lg">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs uppercase" for="email">Personal Email</label>
<div class="relative input-focus-ring rounded border border-outline-variant bg-surface-container-lowest transition-all group">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined" style="font-size: 20px;">mail</span>
</div>
<input class="block w-full pl-[36px] pr-sm py-sm bg-transparent border-none focus:ring-0 text-on-surface font-body-md placeholder-secondary-fixed-dim" id="email" placeholder="you@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs uppercase" for="password">Password</label>
<div class="relative input-focus-ring rounded border border-outline-variant bg-surface-container-lowest transition-all group">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-secondary">
<span class="material-symbols-outlined" style="font-size: 20px;">lock</span>
</div>
<input class="block w-full pl-[36px] pr-lg py-sm bg-transparent border-none focus:ring-0 text-on-surface font-body-md placeholder-secondary-fixed-dim" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-secondary hover:text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="eyeIcon" style="font-size: 20px;">visibility</span>
</button>
</div>
<div class="flex justify-end mt-xs">
<a class="font-caption text-caption text-primary hover:text-primary-fixed-variant transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary py-[10px] px-lg rounded-lg font-label-md text-label-md uppercase tracking-wider elevation-2 flex justify-center items-center gap-sm transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container" type="submit">
<span>Login</span>
<span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-lg mb-lg relative flex items-center">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-sm text-secondary font-caption text-caption uppercase tracking-wider">or</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Alternative Actions -->
<div class="space-y-sm flex flex-col items-center">
<p class="font-body-md text-body-md text-secondary">
                    Don't have an account? <a class="text-primary font-semibold hover:underline transition-all" href="#">Create Account</a>
</p>
<a class="font-caption text-caption text-secondary hover:text-on-surface flex items-center gap-xs mt-sm transition-colors" href="#">
<span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                    Back to Website
                </a>
</div>
</div>
</main>
<!-- Footer Component as defined in JSON -->
<footer class="w-full py-8 mt-auto bg-surface-container-low border-t border-outline-variant flex flex-col md:flex-row justify-between items-center px-gutter gap-4 text-secondary font-caption text-caption">
<div class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">
            DevSprint Auth
        </div>
<div>
            © 2024 DevSprint Collegiate Hackathon Series. Built for innovators.
        </div>
<div class="flex gap-lg">
<a class="text-on-surface-variant hover:text-primary transition-all" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-all" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-primary transition-all" href="#">Contact Organizer</a>
</div>
</footer>
<script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eyeIcon');

        togglePassword.addEventListener('click', function (e) {
            // toggle the type attribute
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // toggle the icon
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
    </script>
</body></html>
