<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Participant Registration - DevSprint Auth</title>

                        "on-background": "#191c1e",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-container": "#eeefff",
                        "inverse-primary": "#b4c5ff",
                        "outline": "#737686",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-tertiary-fixed": "#370e00",
                        "surface-bright": "#f7f9fb",
                        "tertiary-fixed": "#ffdbce",
                        "secondary": "#515f74",
                        "on-tertiary-fixed-variant": "#7f2b00",
                        "tertiary-container": "#bf4500",
                        "on-error": "#ffffff",
                        "background": "#f7f9fb",
                        "on-surface-variant": "#434655",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-primary-fixed": "#00174b",
                        "primary-container": "#2563eb",
                        "secondary-container": "#d5e3fc",
                        "on-surface": "#191c1e",

                        "surface-tint": "#0053db",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                    },
                    "spacing": {
                        "xxl": "64px",
                        "sm": "8px",
                        "base": "8px",
                        "xs": "4px",
                        "container-max": "1280px",

                        "gutter": "24px",

                    },
                    "fontFamily": {

<style>
        .custom-shadow-1 {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }
        .form-input {
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #2563eb !important;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2) !important;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased pt-[76px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant shadow-sm">
<div class="flex justify-between items-center px-gutter py-4 max-w-container-max mx-auto">
<div class="font-headline-md text-headline-md font-bold text-primary">
                DevSprint Auth
            </div>
<div class="hidden">
<!-- Search bar hidden per JSON -->
</div>
<button class="font-label-md text-label-md text-secondary hover:text-primary-container transition-colors cursor-pointer active:scale-95 duration-200 flex items-center gap-2">
                Support
                <span class="material-symbols-outlined text-[18px]">help</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow w-full max-w-container-max mx-auto px-gutter py-xl md:py-xxl">
<div class="max-w-3xl mx-auto">
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Participant Registration</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Complete your profile to join the DevSprint collegiate hackathon.</p>
</div>
<form class="space-y-lg">
<!-- Personal Details Section -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg custom-shadow-1">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md pb-xs border-b border-surface-variant">Personal Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="fullName">Full Name</label>
<input class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder-outline" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Personal Email</label>
<input class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder-outline" id="email" placeholder="jane.doe@example.com" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="mobile">Mobile Number</label>
<input class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder-outline" id="mobile" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</div>
<!-- College Details Section -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg custom-shadow-1">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md pb-xs border-b border-surface-variant">College Details</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="collegeName">College Name</label>
<input class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder-outline" id="collegeName" placeholder="University of Technology" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="branch">Branch / Major</label>
<input class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder-outline" id="branch" placeholder="Computer Science" type="text"/>
</div>
<div class="grid grid-cols-2 gap-sm">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="year">Year</label>
<select class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface" id="year">
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="semester">Semester</label>
<select class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface" id="semester">
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
</select>
</div>
</div>
<div class="col-span-1 md:col-span-2">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="rollNumber">Student / Roll Number</label>
<input class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder-outline" id="rollNumber" placeholder="CS-2024-001" type="text"/>
</div>
</div>
</div>
<!-- Account Section -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg custom-shadow-1">
<h2 class="font-headline-md text-headline-md text-on-surface mb-md pb-xs border-b border-surface-variant">Account Security</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="password">Password</label>
<input class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder-outline" id="password" placeholder="••••••••" type="password"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="confirmPassword">Confirm Password</label>
<input class="form-input w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-on-surface placeholder-outline" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<div class="flex justify-end pt-sm">
<button class="bg-primary-container text-on-primary font-label-md text-label-md rounded-lg px-xl py-sm hover:bg-primary-fixed-variant transition-colors custom-shadow-1 active:scale-95 duration-200" type="button">
                        Complete Registration
                    </button>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="w-full py-8 mt-auto bg-surface-container-low border-t border-outline-variant">
<div class="flex flex-col md:flex-row justify-between items-center px-gutter gap-4 max-w-container-max mx-auto">
<div class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">
                © 2024 DevSprint Collegiate Hackathon Series. Built for innovators.
            </div>
<div class="flex flex-wrap gap-4 font-caption text-caption">
<a class="text-on-surface-variant hover:text-primary transition-all" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-all" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-primary transition-all" href="#">Contact Organizer</a>
</div>
</div>
</footer>
</body></html>
